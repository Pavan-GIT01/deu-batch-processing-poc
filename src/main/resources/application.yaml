spring:
  application:
    name: deu-batch-processing

  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/mydb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

app:
  sqs:
    dispatcher-queue-url: ${DISPATCHER_QUEUE_URL}
    batch-queue-url: ${BATCH_QUEUE_URL}
  s3:
    bucket: ${S3_BUCKET_NAME:sqs-postgresql-bucket}